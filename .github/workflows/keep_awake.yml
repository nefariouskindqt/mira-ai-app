name: Keep Streamlit App Awake
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit container
        # This hits the hidden health-check endpoint that forces the Python app to wake up
        run: curl -s https://solar-engineering-ai.streamlit.app/_stcore/health
